const dates=['12/03（四）','12/04（五）','12/05（六）','12/06（日）','12/07（一）'];
const chars=['酷洛米','Hello Kitty','美樂蒂','布丁狗','大耳狗'];
const icons={景點:'📍',美食:'🍜',購物:'🛍️',交通:'🚃',住宿:'🏨',咖啡:'☕',其他:'✨'};
const key='osaka-sanrio-2026-github-v3';
const blank=()=>({days:Array.from({length:5},()=>({theme:'',note:'',stops:[]})),hotel:'',hotelAddress:'',flightOut:'',flightBack:'',general:'',todos:[]});
let data=blank(), day=0, editing=null, context=null,playing=false,seq=0,tick=null;
const $=x=>document.getElementById(x);
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.days)&&x.days.length===5)data=x;}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(data));$('saved').textContent='✓ 已自動儲存';}catch{$('saved').textContent='瀏覽器無法儲存，請匯出備份';}}
let timer;function toast(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('on'),2200)}
const defaultStop=()=>({time:'',type:'景點',icon:'',status:'',name:'',subtitle:'',address:'',map:'',transport:'',move:'',stay:'',price:'',pins:[],important:'',notes:''});
function face(s){return safe(s.icon||icons[s.type]||'📍')}
function drawDays(){$('days').innerHTML=dates.map((d,i)=>`<button class="date ${i===day?'active':''}" data-day="${i}"><b>DAY ${i+1}</b><small>${d}</small><img alt="${chars[i]}" src="${CHARS[i]}"><span>${safe(data.days[i].theme)||'自由安排 ♡'}</span></button>`).join('')}
const dots=[[15,25],[47,16],[82,30],[72,69],[25,76],[54,53],[15,54],[82,82],[35,35],[57,87],[88,51],[43,71]];
function drawMap(){const a=data.days[day].stops;$('mapempty').style.display=a.length?'none':'grid';$('nodes').innerHTML=a.map((s,i)=>{const p=dots[i%dots.length];return `<button class="mapnode" style="left:${p[0]}%;top:${p[1]}%" data-map="${i}">${face(s)} ${safe(s.name||'景點 '+(i+1))}</button>`}).join('');$('line').setAttribute('d',a.map((s,i)=>{const p=dots[i%dots.length];return `${i?'L':'M'}${p[0]*6} ${p[1]*3.1}`}).join(' '))}
function drawStops(){const a=data.days[day].stops;$('num1').textContent=$('num2').textContent=a.length+' 個景點';$('overview').innerHTML=a.length?a.map((s,i)=>`<div class="ov"><div class="bubble">${face(s)}</div><strong>${safe(s.name)}</strong><div class="time">${safe(s.time||'時間未定')}</div><small>${safe(s.stay||s.type)}</small></div>`).join(''):'<div class="empty">新增景點後，會在這裡顯示可愛的路線總覽 ♡</div>';$('timeline').innerHTML=a.length?a.map((s,i)=>`<div class="step"><div class="hour">${safe(s.time||'--:--')}</div><article class="stop" id="stop-${i}"><div class="sthead"><span class="icon">${face(s)}</span><div><strong>${safe(s.name)}</strong>${s.subtitle?`<div class="small">${safe(s.subtitle)}</div>`:''}</div></div><div style="margin-top:8px"><span class="labelpill">${safe(s.type)}</span> ${s.status?`<span class="labelpill">${safe(s.status)}</span>`:''}</div>${s.transport||s.move||s.stay||s.price?`<div class="small" style="margin-top:9px">${safe([s.transport,s.move,s.stay,s.price].filter(Boolean).join(' ／ '))}</div>`:''}${s.important?`<div class="warning">${safe(s.important)}</div>`:''}${s.pins?.length?`<ul>${s.pins.map(p=>`<li>${safe(p)}</li>`).join('')}</ul>`:''}${s.notes?`<div class="notes">${safe(s.notes)}</div>`:''}<div class="links"><a href="#" data-act="map" data-i="${i}">📍 Google 地圖</a></div><div class="actions"><button class="btn mini" data-act="edit" data-i="${i}">✏️ 編輯</button><button class="btn mini" data-act="up" data-i="${i}" ${i===0?'disabled':''}>↑</button><button class="btn mini" data-act="down" data-i="${i}" ${i===a.length-1?'disabled':''}>↓</button><button class="btn mini" data-act="delete" data-i="${i}">刪除</button></div></article></div>`).join(''):'<div class="empty">這天還沒有行程，點「＋ 新增行程」開始吧 ♡</div>';drawMap();drawDays()}
function drawTodos(){$('checks').innerHTML=data.todos.length?data.todos.map((x,i)=>`<label><input data-check="${i}" type="checkbox" ${x.done?'checked':''}><span class="${x.done?'done':''}">${safe(x.text)}</span><button class="btn mini" data-del="${i}" aria-label="刪除清單">×</button></label>`).join(''):'<p class="small">清單目前是空白的。</p>'}
function render(){drawDays();$('dayname').textContent='DAY 0'+(day+1);$('dateLabel').textContent=dates[day];$('theme').value=data.days[day].theme||'';$('dayNote').value=data.days[day].note||'';['hotel','hotelAddress','flightOut','flightBack','general'].forEach(id=>$(id).value=data[id]||'');drawStops();drawTodos();$('editor').hidden=true;editing=null}
function openForm(i){editing=i;const s=i===null?defaultStop():{...defaultStop(),...data.days[day].stops[i]};$('editorTitle').textContent=i===null?'＋ 新增景點':'✏️ 編輯景點';for(const [id,k] of Object.entries({fTime:'time',fType:'type',fIcon:'icon',fStatus:'status',fName:'name',fSubtitle:'subtitle',fAddress:'address',fMap:'map',fTransport:'transport',fMove:'move',fStay:'stay',fPrice:'price',fImportant:'important',fNotes:'notes'}))$(id).value=s[k]||'';$('fPins').value=(s.pins||[]).join('\n');$('editor').hidden=false;$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function maps(s){let v=(s.map||'').trim(),a=(s.address||'').trim();window.open(/^https?:\/\//i.test(v)?v:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||s.name),'_blank','noopener,noreferrer')}
$('faces').innerHTML=CHARS.map((src,i)=>`<img alt="${chars[i]}" src="${src}">`).join('');
$('days').onclick=e=>{let x=e.target.closest('[data-day]');if(x){day=Number(x.dataset.day);render();$('dateLabel').scrollIntoView({behavior:'smooth',block:'center'})}};
$('theme').oninput=e=>{data.days[day].theme=e.target.value;save();drawDays()};$('dayNote').oninput=e=>{data.days[day].note=e.target.value;save()};['hotel','hotelAddress','flightOut','flightBack','general'].forEach(id=>$(id).oninput=e=>{data[id]=e.target.value;save()});
$('newTop').onclick=$('newBottom').onclick=()=>openForm(null);$('cancel').onclick=()=>{$('editor').hidden=true;editing=null};
$('saveStop').onclick=()=>{if(!$('fName').value.trim()){toast('請先輸入景點名稱');return}const names={fTime:'time',fType:'type',fIcon:'icon',fStatus:'status',fName:'name',fSubtitle:'subtitle',fAddress:'address',fMap:'map',fTransport:'transport',fMove:'move',fStay:'stay',fPrice:'price',fImportant:'important',fNotes:'notes'};let s={};for(const [id,k] of Object.entries(names))s[k]=$(id).value.trim();s.pins=$('fPins').value.split(/\n+/).map(t=>t.trim()).filter(Boolean);if(editing===null)data.days[day].stops.push(s);else data.days[day].stops[editing]=s;save();drawStops();$('editor').hidden=true;toast('已儲存景點')};
$('timeline').onclick=e=>{let b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();const i=Number(b.dataset.i),act=b.dataset.act,a=data.days[day].stops;if(act==='map'){maps(a[i]);return}if(act==='edit'){openForm(i);return}if(act==='delete'){if(!confirm('確定刪除這個景點？'))return;a.splice(i,1)}if(act==='up'&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];if(act==='down'&&i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]];save();drawStops()};
$('nodes').onclick=e=>{let x=e.target.closest('[data-map]');if(x)$('stop-'+x.dataset.map)?.scrollIntoView({behavior:'smooth',block:'center'})};
$('allMaps').onclick=()=>{let a=data.days[day].stops;if(!a.length){toast('先新增景點');return}if(a.length===1){maps(a[0]);return}const p=a.map(s=>s.address||s.name),q='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p[0])+'&destination='+encodeURIComponent(p[p.length-1])+(p.length>2?'&waypoints='+encodeURIComponent(p.slice(1,-1).join('|')):'');window.open(q,'_blank','noopener,noreferrer')};
$('sort').onclick=()=>{data.days[day].stops.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));save();drawStops();toast('已依時間排序')};
$('addTodo').onclick=()=>{let s=prompt('新增清單項目：');if(s?.trim()){data.todos.push({text:s.trim(),done:false});save();drawTodos()}};
$('checks').onchange=e=>{let x=e.target.closest('[data-check]');if(x){data.todos[Number(x.dataset.check)].done=x.checked;save();drawTodos()}};
$('checks').onclick=e=>{let x=e.target.closest('[data-del]');if(x){data.todos.splice(Number(x.dataset.del),1);save();drawTodos()}};
$('export').onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='OSAKA_三麗鷗行程備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('import').onclick=()=>$('upload').click();$('upload').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.days)||d.days.length!==5)throw new Error('invalid');if(confirm('匯入後會覆蓋目前行程，確定？')){data=d;day=0;save();render();toast('匯入成功')}}catch{alert('檔案格式不正確')}e.target.value=''};
$('reset').onclick=()=>{if(confirm('確定清空所有行程？')){data=blank();day=0;save();render()}};$('print').onclick=()=>window.print();
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.theme;toast('主題已切換')});
$('clockBtn').onclick=()=>{$('clock').textContent='🇯🇵 日本時間：'+new Date().toLocaleString('zh-TW',{timeZone:'Asia/Tokyo',hour12:false})};
const notes=[523,659,784,659,587,659,523,392,440,523,659,523,494,440,392,0];function tone(freq){if(!freq||!context)return;let o=context.createOscillator(),g=context.createGain(),t=context.currentTime;o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(context.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.025,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.35)}
$('musicBtn').onclick=async()=>{if(playing){playing=false;clearInterval(tick);$('musicBtn').textContent='▶ 輕音樂';return}try{context=context||new(window.AudioContext||window.webkitAudioContext)();await context.resume();playing=true;seq=0;tone(notes[seq++]);tick=setInterval(()=>tone(notes[seq++%notes.length]),410);$('musicBtn').textContent='Ⅱ 暫停音樂'}catch{toast('目前瀏覽器不支援音樂')}};
render();
</script></body></html>
